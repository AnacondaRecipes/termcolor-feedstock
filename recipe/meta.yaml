{% set name = "termcolor" %}
{% set version = "3.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 610e6456feec42c4bcd28934a8c87a06c3fa28b01561d46aa09a9881b8622c58

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: True  # [py<310]

requirements:
  host:
    - python
    - hatch-vcs
    - hatchling >=1.27
    - pip
  run:
    - python

test:
  source_files:
    - tests
  imports:
    - termcolor
  commands:
    - pip check
    - pytest -v tests
  requires:
    - pip
    - pytest

about:
  home: https://github.com/termcolor/termcolor
  license: MIT
  license_family: MIT
  license_file: COPYING.txt
  summary: ANSII Color formatting for output in terminal.
  description: |
    ANSI color formatting for output in terminal.
  dev_url: https://github.com/termcolor/termcolor
  doc_url: https://github.com/termcolor/termcolor/blob/main/README.md

extra:
  recipe-maintainers:
    - jakirkham
    - ocefpaf
