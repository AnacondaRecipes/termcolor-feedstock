{% set name = "termcolor" %}
{% set version = "2.4.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: aab9e56047c8ac41ed798fa36d892a37aca6b3e9159f3e0c24bc64a9b3ac7b7a

build:
  number: 0

  noarch: python
  skip: True  # [py<37]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - hatch-vcs
    - hatchling
    - pip
    - setuptools
    - wheel
  run:
    - python

test:
  imports:
    - termcolor
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/termcolor/termcolor
  license: MIT
  license_family: MIT
  license_file: COPYING.txt
  summary: ANSII Color formatting for output in terminal.
  description: |
    ANSI color formatting for output in terminal.
  dev_url: https://github.com/termcolor/termcolor
  doc_url: https://github.com/termcolor/termcolor/blob/main/README.md

extra:
  anaconda-services:
    recipe-maintainers:
      - bkreider
    reason: "Needed for gridstatus: https://anaconda.zendesk.com/agent/tickets/50503"
  recipe-maintainers:
    - jakirkham
    - ocefpaf
